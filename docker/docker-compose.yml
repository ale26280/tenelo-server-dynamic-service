# ============================================
# Docker Compose LOCAL - Tenelo Dynamic Service
# Build local para desarrollo y testing
# ============================================
# Uso (desde la carpeta docker/):
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose logs -f ds
# ============================================
name: tenelo-server-dynamic-service

services:
  ds:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker-dynamic-service
    container_name: tenelo.server.ds
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${SERVER_PORT:-44104}"
    read_only: true
    tmpfs:
      - /tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenelo-ds.rule=PathPrefix(`/ds`)"
      - "traefik.http.routers.tenelo-ds.entrypoints=web"
      - "traefik.http.services.tenelo-ds.loadbalancer.server.port=${SERVER_PORT:-44104}"
      - "traefik.docker.network=traefik"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik
